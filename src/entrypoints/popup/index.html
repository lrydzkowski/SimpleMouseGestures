<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Simple Mouse Gestures</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>

  <body>
    <div class="content">
      <div class="headers" role="tablist">
        <button class="header active" role="tab" aria-selected="true" data-name="gestures">Gestures</button>
        <button class="header" role="tab" aria-selected="false" data-name="settings">Settings</button>
        <button class="header" role="tab" aria-selected="false" data-name="backup">Backup</button>
      </div>
      <div class="tab active" role="tabpanel" data-name="gestures">
        <div class="tab-content">
          <div class="row add-row">
            <label>Gesture <input class="gesture-input" type="text" value="" /></label>
            <label>
              Operation
              <select id="operation-select"></select>
            </label>
            <button class="add-button button-filled">Add</button>
          </div>
          <p class="field-error" aria-live="polite"></p>
          <div class="list-content"></div>
        </div>
      </div>
      <div class="tab" role="tabpanel" data-name="settings">
        <div class="tab-content">
          <div class="row">
            <label>
              <span>Line color</span>
              <input id="line-color" type="text" value="#000000" data-coloris />
            </label>
          </div>
          <div class="row">
            <label>
              <span>Line width</span>
              <select id="line-width">
                <option value="1">1px</option>
                <option value="2">2px</option>
                <option value="3">3px</option>
                <option value="4">4px</option>
                <option value="5">5px</option>
                <option value="6">6px</option>
                <option value="7">7px</option>
                <option value="8">8px</option>
                <option value="9">9px</option>
                <option value="10">10px</option>
              </select>
            </label>
          </div>
          <p class="caption">Changes are saved automatically and apply to pages loaded after the change.</p>
        </div>
      </div>
      <div class="tab" role="tabpanel" data-name="backup">
        <div class="tab-content">
          <div class="row">
            <button id="export-button" class="button-outlined">Export</button>
            <button id="import-button" class="button-outlined">Import</button>
            <input id="import-file-input" type="file" accept=".json,application/json" />
          </div>
          <p id="backup-message" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <dialog id="import-dialog">
      <h2>Replace all settings?</h2>
      <p>All current gestures and settings will be replaced. You can use Export first to keep a copy.</p>
      <form method="dialog" class="dialog-buttons">
        <button value="cancel" class="button-text">Cancel</button>
        <button value="replace" class="button-text">Replace</button>
      </form>
    </dialog>
  </body>
</html>
